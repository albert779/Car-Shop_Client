<h2 style="text-align:center;">🚛 Truck List</h2>



<app-add-item-button (saved)="addTruck($event)"></app-add-item-button>

<ul class="car-list">
@for (truck of trucks(); track truck.id){
   <li>
     <app-item
  [itemInfo]="truck"
  type="truck"
  (edit)="editTruck($event)"
  (delete)="deleteTruck($event)"    
  (viewDetails)="detailsTruck($event)"
  (requestInfo)="openRequestInfoDialog($event)">
</app-item>
    </li>
 }

</ul>
