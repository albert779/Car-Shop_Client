<div class="auth-container">

  <h2>Register</h2>

  <form [formGroup]="regForm">

    <!--
     <mat-form-field appearance="outline">
      <mat-label>Id</mat-label>
      <input matInput formControlName="id">
      <mat-error *ngIf="regForm.get('id')?.invalid && submitted">
        Id is required.
      </mat-error>
    </mat-form-field>
  -->

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="FirstName">
      <mat-error *ngIf="regForm.get('FirstName')?.invalid && submitted">
        Name is required.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="LastName">
      <mat-error *ngIf="regForm.get('LastName')?.invalid && submitted">
        Last Name is required.
      </mat-error>
    </mat-form-field>

     <mat-form-field appearance="outline">
      <mat-label>Birth Date</mat-label>
      <input matInput formControlName="BirthDate">
      <mat-error *ngIf="regForm.get('BirthDate')?.invalid && submitted">
        Birth Date is required.
      </mat-error>
    </mat-form-field>

    <!--
    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput formControlName="date">
      <mat-error *ngIf="regForm.get('date')?.invalid && submitted">
        Last Name is required.
      </mat-error>
    </mat-form-field>
  -->

    <mat-form-field appearance="outline">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="Phone">
      <mat-error *ngIf="regForm.get('Phone')?.invalid && submitted">
        Phone is required.
      </mat-error>
    </mat-form-field>


    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="Email">
      <mat-error *ngIf="regForm.get('Email')?.invalid && submitted">
        Enter a valid email.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="Password">
      <mat-error *ngIf="regForm.get('Password')?.invalid && submitted">
        Password is required.
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="submit()">
      Register
    </button>

    <!--
    <div class="login-link">
       <a routerLink="/login">Already have an account? Login</a>
    </div>
  -->

  
  </form>

  <button mat-button color="primary" routerLink="/login">
     Already have an account? Login
  </button>

</div>
